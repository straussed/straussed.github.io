<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Strauss Lab logo placeholder">
  <title>Strauss Lab logo (placeholder)</title>
  <!-- Three vertical stripes: Spartan green, white (middle), sage gray -->
  <rect x="0"  y="0" width="40" height="120" fill="#18453B"/>
  <rect x="40" y="0" width="40" height="120" fill="#FFFFFF"/>
  <rect x="80" y="0" width="40" height="120" fill="#8C918D"/>
  <!-- Thin outline so the white stripe reads on white backgrounds -->
  <rect x="0.75" y="0.75" width="118.5" height="118.5" fill="none" stroke="#C9CDCA" stroke-width="1.5"/>
</svg>
