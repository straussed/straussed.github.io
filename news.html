        <!--
          HOW TO ADD A NEWS ITEM:
          Copy one <figure class="news-photo"> block below and paste it directly
          BELOW this comment (newest items go at the top). Swap the placeholder
          <div> for an <img>, like this:

            <figure class="news-photo">
              <img src="images/news/2026-07-fieldwork.jpg" alt="Short description of the photo">
              <figcaption>
                <span class="news-caption-date">July 2026</span> &mdash; one-sentence caption.
              </figcaption>
            </figure>

          Photos run two per row, left to right then down, and every second one
          sits lower so the order is unambiguous. That stagger comes from the
          item's position in the list, so just keep pasting new items at the top
          and the pattern takes care of itself. Photos can be any aspect ratio;
          they scale to the column width.
        -->

        <figure class="news-photo">
          <div class="placeholder placeholder--wide">[PLACEHOLDER: news photo]</div>
          <figcaption>
            <span class="news-caption-date ph-text">[PLACEHOLDER: date, e.g. July 2026]</span>
            <span class="ph-text">&mdash; [PLACEHOLDER: one-sentence caption]</span>
          </figcaption>
        </figure>

        <figure class="news-photo">
          <div class="placeholder placeholder--wide">[PLACEHOLDER: news photo]</div>
          <figcaption>
            <span class="news-caption-date ph-text">[PLACEHOLDER: date]</span>
            <span class="ph-text">&mdash; [PLACEHOLDER: one-sentence caption]</span>
          </figcaption>
        </figure>

        <figure class="news-photo">
          <div class="placeholder placeholder--wide">[PLACEHOLDER: news photo]</div>

        </figure>
