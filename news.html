      <!--
        HOW TO ADD A NEWS ITEM:
          1. Put the full-size photo in images/large_image_originals/news/
          2. Add a block to content/news-items.txt (any order — it gets sorted)
          3. Run: ./tools/build-images.sh && ./tools/build-news.py

        Do not hand-edit between the markers below — build-news.py overwrites
        it. Everything outside them is yours.

        Photos are laid out in masonry columns by js/news-masonry.js, newest
        first and top-left. They keep their own aspect ratio, so mixing portrait
        and landscape is fine.
      -->
